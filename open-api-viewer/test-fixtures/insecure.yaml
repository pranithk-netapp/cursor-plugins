openapi: 3.0.0
info:
  title: Insecure API
  version: "1.0.0"
servers:
  - url: http://api.example.com
paths:
  /widgets:
    get:
      operationId: getWidgets
      responses:
        "200":
          description: OK
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: query
      name: api_key
    BasicAuth:
      type: http
      scheme: basic
