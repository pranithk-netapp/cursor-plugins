openapi: 3.0.0
info:
  description: The resource provider controller service provides a RESTful set of
    APIs that interacts with Azure Network Resource Provider service, Resource
    Provider database to migrate network resources and retrieves secrets from
    Azure Key Vault using Managed Identity.
  title: Resource Provider Controller
  version: 2024-09-01
paths:
  /v1/nicMigration/prepare:
    post:
      description: API to prepare moving a NIC associated with a svm to a destination
        hyperscaler cluster. This will reserve a VLAN ID in destination cluster
        by creating dummy NIC and BMT.
      tags:
        - Nic Migration
      operationId: NetworkInterface_Move_Prepare
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrepareNicMigrationRequest"
        description: Parameters for prepare network interface move operation.
        required: true
      responses:
        "202":
          description: Prepare network interface migration job created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NicMigrationAsyncResponse"
        "404":
          $ref: "#/components/responses/StandardError-404"
        "409":
          $ref: "#/components/responses/StandardError-409"
        "500":
          $ref: "#/components/responses/StandardError-500"
  /v1/nicMigration/trial:
    post:
      description: Trial API checks if NIC associated with a svm can be moved to a
        destination hyperscaler cluster.
      tags:
        - Nic Migration
      operationId: NetworkInterface_Move_Trial
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrialNicMigrationRequest"
        description: Parameters for trial network interface move operation.
        required: true
      responses:
        "202":
          description: Trial network interface migration job created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NicMigrationAsyncResponse"
        "404":
          $ref: "#/components/responses/StandardError-404"
        "500":
          $ref: "#/components/responses/StandardError-500"
  /v1/nicMigration/{migrationUuid}:
    put:
      description: Start migrating a NIC associated with source svm to destination
        hyperscaler cluster.
      tags:
        - Nic Migration
      operationId: NetworkInterface_Move
      parameters:
        - description: The svm migration Uuid.
          name: migrationUuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Network interface migration job created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NicMigrationAsyncResponse"
        "404":
          $ref: "#/components/responses/StandardError-404"
        "409":
          $ref: "#/components/responses/StandardError-409"
        "500":
          $ref: "#/components/responses/StandardError-500"
    get:
      description: Get details of NIC migration.
      tags:
        - Nic Migration
      operationId: NicMigration_Get
      parameters:
        - description: The svm migration Uuid.
          name: migrationUuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Request successful. The operation returns the details of the
            network interface migration.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NicMigrationResponse"
        "404":
          $ref: "#/components/responses/StandardError-404"
        "500":
          $ref: "#/components/responses/StandardError-500"
    delete:
      description: Cleanup the NIC migration by deleting dummy BMT and NIC created
        during prepare operation.
      tags:
        - Nic Migration
      operationId: NetworkInterface_Cleanup
      parameters:
        - description: The svm migration Uuid.
          name: migrationUuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Network interface migration cleanup job created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NicMigrationAsyncResponse"
        "404":
          $ref: "#/components/responses/StandardError-404"
        "500":
          $ref: "#/components/responses/StandardError-500"
  /v2/svmNicMigration/prepare:
    post:
      description: API to prepare moving a list of NICs associated with a svm to a
        destination hyperscaler cluster. This will reserve a VLAN ID in
        destination cluster using the AzD API
      tags:
        - Nic Migrations
      operationId: v2_prepareNicMigrations
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrepareNicMigrationsV2Request"
        description: Parameters for prepare network interfaces move operation.
        required: true
      responses:
        "202":
          description: Prepare network interfaces migration job created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NicMigrationsAsyncResponse"
        "404":
          $ref: "#/components/responses/StandardError-404"
        "409":
          $ref: "#/components/responses/StandardError-409"
        "500":
          $ref: "#/components/responses/StandardError-500"
  /v2/svmNicMigration/trial:
    post:
      description: Trial API checks if NICs associated with a svm can be moved to a
        destination hyperscaler cluster.
      tags:
        - Nic Migrations
      operationId: v2_trialNicMigrations
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrialNicMigrationsV2Request"
        description: Parameters for trial network interfaces move operation.
        required: true
      responses:
        "202":
          description: Trial network interfaces migration job created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NicMigrationsAsyncResponse"
        "404":
          $ref: "#/components/responses/StandardError-404"
        "500":
          $ref: "#/components/responses/StandardError-500"
  /v2/svmNicMigration/{migrationUuid}:
    put:
      description: Start migrating a list of NICs associated with source svm to
        destination hyperscaler cluster.
      tags:
        - Nic Migrations
      operationId: v2_moveNicMigrations
      parameters:
        - description: The svm migration Uuid.
          name: migrationUuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Network interfaces migration job created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NicMigrationsAsyncResponse"
        "404":
          $ref: "#/components/responses/StandardError-404"
        "409":
          $ref: "#/components/responses/StandardError-409"
        "500":
          $ref: "#/components/responses/StandardError-500"
    get:
      description: Get details of SVM NIC migrations.
      tags:
        - Nic Migrations
      operationId: v2_describeNicMigrations
      parameters:
        - description: The svm migration Uuid.
          name: migrationUuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Request successful. The operation returns the details of the
            network interface migrations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NicMigrationV2Response"
        "404":
          $ref: "#/components/responses/StandardError-404"
        "500":
          $ref: "#/components/responses/StandardError-500"
    delete:
      description: Roll back the SVM NIC migrations prepare operation.
      tags:
        - Nic Migrations
      operationId: v2_rollbackNicMigrations
      parameters:
        - description: The svm migration Uuid.
          name: migrationUuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Network interfaces migration rollback job created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NicMigrationsAsyncResponse"
        "404":
          $ref: "#/components/responses/StandardError-404"
        "500":
          $ref: "#/components/responses/StandardError-500"
  /v1/job/{uuid}:
    get:
      operationId: GetJob
      summary: API to query specific job using Uuid
      tags:
        - Job
      parameters:
        - name: uuid
          in: path
          required: true
          description: uuid used to identify job
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Get job status successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/StandardError-404"
        "500":
          $ref: "#/components/responses/StandardError-500"
  /v1/clusterPeer/CleanupNetworkInfrastructure:
    post:
      description: Api that CVS will use to cleanup nic's and bmt's that was created
        for peering on-prem cluster to ANF.
      tags:
        - ClusterPeer
      operationId: CleanupNetworkInfrastructure
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClusterPeerCleanupNetworkInfrastructureRequest"
        description: Parameters for cleanup network infrastructure of cluster peer.
        required: true
      responses:
        "200":
          description: Cleanup of network infrastructure received successfully.
        "404":
          $ref: "#/components/responses/StandardError-404"
        "500":
          $ref: "#/components/responses/StandardError-500"
  /v1/swiftNetwork/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/infrastructureVirtualNetworks/{infrastructureVirtualNetworkName}:
    put:
      description: Api that CVS/SDS will use to create infrastructure virtual network
        for Swift Networking in ANF Atom.
      tags:
        - SwiftNetwork
      operationId: CreateInfrastructureVirtualNetwork
      parameters:
        - description: The subscription credentials which uniquely identify the Microsoft
            Azure subscription. The subscription ID forms part of the URI for
            every service call.
          name: subscriptionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - description: The name of the resource group.
          name: resourceGroupName
          in: path
          required: true
          schema:
            type: string
        - description: The name of the infrastructure virtual network.
          name: infrastructureVirtualNetworkName
          in: path
          required: true
          schema:
            type: string
        - name: x-ms-correlation-id
          in: header
          required: false
          description: The correlation identifier in UUID format.
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInfrastructureVirtualNetworkRequest"
        description: The request object to create infrastructure virtual network for ANF
          Atom.
        required: true
      responses:
        "202":
          description: Infrastructure virtual network created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VirtualNetwork"
        "404":
          $ref: "#/components/responses/StandardError-404"
        "409":
          $ref: "#/components/responses/StandardError-409"
        "500":
          $ref: "#/components/responses/StandardError-500"
    get:
      description: Get details of Infrastructure virtual network for Swift Networking
        in ANF Atom.
      tags:
        - SwiftNetwork
      operationId: GetInfrastructureVirtualNetwork
      parameters:
        - description: The subscription credentials which uniquely identify the Microsoft
            Azure subscription. The subscription ID forms part of the URI for
            every service call.
          name: subscriptionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - description: The name of the resource group.
          name: resourceGroupName
          in: path
          required: true
          schema:
            type: string
        - description: The name of the infrastructure virtual network.
          name: infrastructureVirtualNetworkName
          in: path
          required: true
          schema:
            type: string
        - name: x-ms-correlation-id
          in: header
          required: false
          description: The correlation identifier in UUID format.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Request successful. The operation returns the details of the
            infrastructure virtual network.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VirtualNetwork"
        "404":
          $ref: "#/components/responses/StandardError-404"
        "500":
          $ref: "#/components/responses/StandardError-500"
    delete:
      description: Delete infrastructure virtual network created for Swift Networking
        in ANF Atom.
      tags:
        - SwiftNetwork
      operationId: DeleteInfrastructureVirtualNetwork
      parameters:
        - description: The subscription credentials which uniquely identify the Microsoft
            Azure subscription. The subscription ID forms part of the URI for
            every service call.
          name: subscriptionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - description: The name of the resource group.
          name: resourceGroupName
          in: path
          required: true
          schema:
            type: string
        - description: The name of the infrastructure virtual network.
          name: infrastructureVirtualNetworkName
          in: path
          required: true
          schema:
            type: string
        - name: x-ms-correlation-id
          in: header
          required: false
          description: The correlation identifier in UUID format.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Infrastructure virtual network deleted successfully.
        "404":
          $ref: "#/components/responses/StandardError-404"
        "500":
          $ref: "#/components/responses/StandardError-500"
  /v1/health:
    get:
      description: Api that the liveness probe will use to perform health checks on
        the Resource Provider Controller.
      tags:
        - Health
      operationId: HealthCheck
      responses:
        "200":
          description: Health check successful
  /v1/akv/FetchAkvObjectData:
    post:
      description: Generic API to retrieve AKV secret or certificate data from Azure
        Key Vault using MSI assigned to the resource. The method navigates to
        the root resource (NetApp account or ActiveDirectoryConfig)
        automatically to resolve the MSI identity. The service generates a
        random 32-byte encryption key to encrypt the object value with
        AES-256-GCM, then encrypts that encryption key using the RSA public key
        from the x-rsa-public-key header.
      tags:
        - Akv data fetch
      operationId: Akv_Data_Fetch_Object
      parameters:
        - name: x-ms-correlation-id
          in: header
          required: false
          description: The correlation identifier in UUID format.
          schema:
            type: string
            format: uuid
        - name: x-rsa-public-key
          in: header
          required: true
          description: RSA public key used to encrypt the randomly generated 32-byte
            encryption key.
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FetchAkvObjectDataRequest"
        description: Parameters for fetching AKV object data.
        required: true
      responses:
        "200":
          description: AKV object retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AkvObjectData"
        "400":
          $ref: "#/components/responses/StandardError-400"
        "409":
          $ref: "#/components/responses/StandardError-409"
        "500":
          $ref: "#/components/responses/StandardError-500"
security:
  - ApiKey: []
    SecretKey: []
servers:
  - url: https://management.netapp.com
components:
  responses:
    StandardError-400:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            response:
              value:
                code: 400
                message: Bad Request or Input
    StandardError-404:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            response:
              value:
                code: 404
                message: The resource was not found
    StandardError-409:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            response:
              value:
                code: 409
                message: Conflict. Resource already exists
    StandardError-500:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            response:
              value:
                code: 500
                message: Internal server Error
  securitySchemes:
    ApiKey:
      type: apiKey
      name: api-key
      in: header
    SecretKey:
      type: apiKey
      name: secret-key
      in: header
  schemas:
    TrialNicMigrationRequest:
      description: The request object for trial NIC move operation payload
      required:
        - vendorSubnetId
        - svmName
        - migrationUuid
        - destinationHSClusterUuid
        - destinationHSClusterNetworkConnectivity
        - sourceHSClusterUuid
      properties:
        vendorSubnetId:
          description: The vendor subnet Id.
          type: string
        migrationUuid:
          type: string
          description: The svm migration Uuid.
        sourceHSClusterUuid:
          type: string
          description: The source hyperscaler cluster Uuid.
        destinationHSClusterUuid:
          type: string
          description: The destination hyperscaler cluster Uuid.
        destinationHSClusterProvisionedStorageAvailabilityZone:
          description: >
            The destination hyperscaler cluster provisioned storage availability
            zone refers to the storage availability zone

            where the hyperscaler cluster resides. In Azure, this refers to the
            physical availability zone where hyperscaler cluster resides.
          type: string
        destinationHSClusterNetworkConnectivity:
          description: The destination hyperscaler cluster network connectivity.
          type: string
        destinationHSClusterPublicNetworkConnectivity:
          description: The destination hyperscaler cluster public network connectivity.
          type: string
        svmName:
          description: The name of the svm.
          type: string
    PrepareNicMigrationRequest:
      description: The request object for prepare NIC operation payload
      required:
        - vendorSubnetId
        - svmName
        - migrationUuid
        - destinationHSClusterUuid
        - destinationHostId
        - destinationStampId
        - destinationHSClusterNetworkConnectivity
        - sourceHSClusterUuid
      properties:
        vendorSubnetId:
          description: The vendor subnet Id.
          type: string
        migrationUuid:
          type: string
          description: The svm migration Uuid.
        sourceHSClusterUuid:
          type: string
          description: The source hyperscaler cluster Uuid.
        destinationHSClusterUuid:
          type: string
          description: The destination hyperscaler cluster Uuid.
        destinationHostId:
          description: The destination host Id (or host name if host Id was null)
          type: string
        destinationStampId:
          description: The destination stamp Id (or stamp name if host Id was null)
          type: string
        destinationHSClusterProvisionedStorageAvailabilityZone:
          description: >
            The destination hyperscaler cluster provisioned storage availability
            zone refers to the storage availability zone

            where the hyperscaler cluster resides. In Azure, this refers to the
            physical availability zone where hyperscaler cluster resides.
          type: string
        destinationHSClusterNetworkConnectivity:
          description: The destination hyperscaler cluster network connectivity.
          type: string
        destinationHSClusterPublicNetworkConnectivity:
          description: The destination hyperscaler cluster public network connectivity.
          type: string
        svmName:
          description: The name of the svm.
          type: string
    PrepareNicMigrationsV2Request:
      description: The request object for prepare SVM NIC migrations operation.
      required:
        - svmName
        - migrationUuid
        - sourceHSClusterUuid
        - destinationHSClusterUuid
        - destinationHostId
        - destinationStampId
      properties:
        migrationUuid:
          type: string
          description: The SVM NIC migrations Uuid.
        sourceHSClusterUuid:
          type: string
          description: The source hyperscaler cluster Uuid.
        destinationHSClusterUuid:
          type: string
          description: The destination hyperscaler cluster Uuid.
        destinationHostId:
          description: The destination host Id (or host name if host Id was null)
          type: string
        destinationStampId:
          description: The destination stamp Id (or stamp name if host Id was null)
          type: string
        svmName:
          description: The name of the svm.
          type: string
    TrialNicMigrationsV2Request:
      description: The request object for trial SVM NIC migrations operation.
      required:
        - svmName
        - migrationUuid
        - destinationHSClusterUuid
      properties:
        migrationUuid:
          type: string
          description: The SVM NIC migrations Uuid.
        destinationHSClusterUuid:
          type: string
          description: The destination hyperscaler cluster Uuid.
        svmName:
          description: The name of the svm.
          type: string
    Error:
      description: An error response from the service.
      type: object
      properties:
        code:
          description: An identifier for the error.
          type: string
        message:
          description: A message describing the error, intended to be suitable for display
            in a user interface.
          type: string
      required:
        - code
        - message
    MigrationState:
      description: The current NIC migration state.
      type: string
      enum:
        - New
        - Preparing
        - Prepared
        - Moving
        - Moved
        - Deleting
        - Deleted
        - Failed
      readOnly: true
    MigrationStateDetails:
      description: The details of the current NIC migration state.
      type: string
      enum:
        - None
        - LockNssStarted
        - LockNssFinished
        - TrialCheckStarted
        - TrialCheckFinished
        - DummyNicCreationStarted
        - DummyNicCreationFinished
        - DummyBmtCreationStarted
        - DummyBmtCreationFinished
        - DummySourceNicCreationStarted
        - DummySourceNicCreationFinished
        - DummySourceBmtCreationStarted
        - DummySourceBmtCreationFinished
        - CreateOrphanEntriesStarted
        - CreateOrphanEntriesFinished
        - AddNicMigrationVolumesStarted
        - AddNicMigrationVolumesFinished
        - UpdateVolumeResourceTableStarted
        - UpdateVolumeResourceTableFinished
        - DeleteSourceBmtStarted
        - DeleteSourceBmtFinished
        - CreateDestinationBmtStarted
        - CreateDestinationBmtFinished
        - AssociateVolumeWithDestinationBmtStarted
        - AssociateVolumeWithDestinationBmtFinished
        - RetrieveNssEntriesStarted
        - RetrieveNssEntriesFinished
        - UpdateNssTableStarted
        - UpdateNssTableFinished
        - UpdateNssNicTableStarted
        - UpdateNssNicTableFinished
        - DeleteDummyBmtStarted
        - DeleteDummyBmtFinished
        - DeleteDummyNicStarted
        - DeleteDummyNicFinished
        - DeleteDummySourceBmtStarted
        - DeleteDummySourceBmtFinished
        - DeleteDummySourceNicStarted
        - DeleteDummySourceNicFinished
        - DeleteOrphanEntriesStarted
        - DeleteOrphanEntriesFinished
        - UnlockNssStarted
        - UnlockNssFinished
    NicMigrationAsyncResponse:
      description: The response payload for asynchronous NIC migration operations.
      properties:
        jobUuid:
          description: The NIC migration job Uuid.
          type: string
    NicMigrationsAsyncResponse:
      description: The response payload for asynchronous SVM NIC migrations operations.
      properties:
        jobUuid:
          description: The SVM NIC migrations job Uuid.
          type: string
    NicMigrationResponse:
      description: The response payload for get NIC migration operation.
      properties:
        state:
          $ref: "#/components/schemas/MigrationState"
        stateDetails:
          $ref: "#/components/schemas/MigrationStateDetails"
        criticalWarnings:
          description: A critical warning message regarding the NIC migration.
          type: string
        lastLifeCycleState:
          $ref: "#/components/schemas/MigrationState"
        migrationUuid:
          description: The network interface migration Uuid.
          type: string
        sourceSvmName:
          description: The source svm name.
          type: string
        sourceBmtId:
          description: The source bare metal tenant Id.
          type: string
        sourceNicId:
          description: The source network interface Id.
          type: string
        dummyBmtId:
          description: The dummy destination bare metal tenant Id.
          type: string
        dummyNicId:
          description: The dummy destination network interface Id.
          type: string
        dummySourceBmtId:
          description: The dummy source bare metal tenant Id.
          type: string
        dummySourceNicId:
          description: The dummy source network interface Id.
          type: string
        vlanId:
          description: The vlan Id reserved on destination hyperscaler cluster.
          type: integer
        destinationHSClusterUuid:
          description: The destination hyperscaler cluster Uuid.
          type: string
        destinationHostId:
          description: The destination host Id (or host name if host Id was null)
          type: string
        destinationStampId:
          description: The destination stamp Id (or stamp name if host Id was null)
          type: string
        vendorSubnetId:
          description: The vendor subnet Id.
          type: string
        volumeResourceIds:
          description: The list of volume resource Ids associated with a NIC.
          type: array
          items:
            type: string
        hasDeleteBeenRequested:
          description: A flag indicating whether cleanup was requested earlier for this
            migration.
          type: boolean
        subscriptionUuid:
          description: The subscription UUID.
          type: string
        sourceHSClusterUuid:
          description: The source hyperscaler cluster Uuid.
          type: string
        DestinationProvisionedAvailabilityZone:
          description: The (logical) availability zone that the volumes were already
            provisioned with.
          type: string
        DestinationProvisionedStorageAvailabilityZone:
          description: The storage (physical) availability zone.
          type: string
        DestinationNetworkConnectivity:
          description: The network connectivity that is used to set the network
            connectivities of the volumes.
          type: string
        NetworkFeatures:
          description: The network features of the migrating NIC
          type: string
    NicMigrationV2Response:
      description: The response payload for get SVM NIC migrations operation.
      properties:
        state:
          $ref: "#/components/schemas/MigrationState"
        stateDetails:
          $ref: "#/components/schemas/MigrationStateDetails"
        criticalWarnings:
          description: A critical warning message regarding the SVM NIC migrations.
          type: string
        lastLifeCycleState:
          $ref: "#/components/schemas/MigrationState"
        migrationUuid:
          description: The SVM NIC migrations Uuid.
          type: string
        sourceSvmName:
          description: The source svm name.
          type: string
        vlanId:
          description: The vlan Id reserved on destination hyperscaler cluster.
          type: integer
        destinationHSClusterUuid:
          description: The destination hyperscaler cluster Uuid.
          type: string
        destinationHostId:
          description: The destination host Id (or host name if host Id was null)
          type: string
        destinationStampId:
