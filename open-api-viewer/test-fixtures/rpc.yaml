    FetchAkvObjectDataRequest:
      description: Request object for fetching AKV object data from Azure Key Vault.
      required:
        - resourceId
        - akvUri
        - objectName
        - objectType
      properties:
        resourceId:
          description: The resource ID at any level in the resource hierarchy (e.g.,
            netAppAccount, activeDirectoryConfig, ldapConfig). The service
            automatically navigates to the root resource to resolve the MSI
            identity for AKV authentication.
          type: string
          pattern: ^/subscriptions/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/resourceGroups/[^/]+/providers/Microsoft\.NetApp/.+$
          example: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/myRG/providers/Microsoft.NetApp/netAppAccounts/account1
        akvUri:
          description: The Azure Key Vault URI from which the object is retrieved.
          type: string
          minLength: 1
          maxLength: 2048
          pattern: ^(?i)https://[a-z][a-z0-9-]*\.vault.*$
          example: https://mykeyvault.vault.azure.net/
        objectName:
          description: The name of the AKV object (secret or certificate name).
          type: string
          minLength: 1
          maxLength: 127
          pattern: ^[a-zA-Z0-9-]+$
          example: my-secret-name
        objectType:
          description: The type of AKV object to fetch. Valid values are Secret or
            Certificate.
          type: string
          enum:
            - Secret
            - Certificate
          example: Secret
        msiResourceId:
          description: The resource ID of the user-assigned managed identity to use for
            AKV authentication. If not provided, the system-assigned identity is
            used.
          type: string
          maxLength: 2048
          pattern: ^/subscriptions/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/resourceGroups/[^/]+/providers/Microsoft\.ManagedIdentity/userAssignedIdentities/[^/]+$
          nullable: true
          example: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/myRG/providers/Microsoft.ManagedIdentity/userAssignedIdentities/myIdentity
        msiIdentityUrl:
          description: MSI Identity URL to fetch metadata for accessing the AKV.
          type: string
          maxLength: 2048
          format: uri
          nullable: true
          example: https://control-region.identity.azure.net/subscriptions/00000000-0000-0000-0000-000000000000/resourcegroups/myRG/providers/Microsoft.NetApp/resource/account/credentials/v2/identity-type
    AkvObjectData:
      description: AKV object data (secret or certificate) retrieved from Azure Key
        Vault. The object value is encrypted using AES-256-GCM with a randomly
        generated 32-byte encryption key, and that encryption key is encrypted
        using the RSA public key provided in the x-rsa-public-key header.
      properties:
        objectValue:
          description: The AKV object value encrypted using AES-256-GCM with a randomly
            generated 32-byte encryption key.
          type: string
        encryptionKey:
          description: The randomly generated 32-byte encryption key encrypted using the
            RSA public key provided in the x-rsa-public-key request header.
          type: string
